[project]
name = "opsgenie-mcp"
version = "0.1.0"
description = "MCP server for the Opsgenie REST API (Alert, Incident, Team, Schedule, Escalation, Service and related resources)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.41.0",
]

[project.scripts]
opsgenie-mcp = "opsgenie_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsgenie_mcp"]
